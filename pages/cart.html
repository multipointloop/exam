<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 — 長門番堂</title>
    <meta name="description" content="長門番堂购物车页面。学号：24215220132 姓名：黄政源">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="site-header">
        <div class="header-inner"></div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content cart-page">
        <!-- 面包屑 -->
        <div class="breadcrumb">
            <a href="../index.html">首页</a> <span>›</span>
            <span>购物车</span>
        </div>

        <div class="page-hero">
            <h1>🛒 我的购物车</h1>
            <p>确认商品信息后，点击结算提交订单</p>
        </div>

        <!-- 购物车内容 -->
        <div id="cartContent"></div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-inner"></div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
    /**
     * 長門番堂 — 购物车页逻辑
     * 学号：24215220132  姓名：黄政源
     */
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();
        renderCart();

        function renderCart() {
            const container = document.getElementById('cartContent');
            const items = cart.getDetailedItems();

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="icon">🛒</div>
                        <h3>购物车是空的</h3>
                        <p>快去挑选心仪的商品吧~</p>
                        <a href="../index.html" class="btn btn-primary" style="margin-top:16px;">去逛逛</a>
                    </div>`;
                return;
            }

            const totalAmount = cart.getTotalAmount();

            let tableHTML = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th class="col-product">商品信息</th>
                            <th class="col-price">单价</th>
                            <th class="col-qty">数量</th>
                            <th class="col-subtotal">小计</th>
                            <th class="col-action">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => `
                            <tr>
                                <td>
                                    <div class="cart-product">
                                        <img src="../${item.product.image}" alt="${item.product.name}"
                                             onerror="this.style.display='none'">
                                        <div>
                                            <a href="product.html?id=${item.product.id}" class="name">${item.product.name}</a>
                                            <div style="font-size:0.78rem;color:var(--text-muted);">${item.product.category}</div>
                                        </div>
                                    </div>
                                </td>
                                <td style="font-weight:600;">¥${item.product.price.toFixed(2)}</td>
                                <td>
                                    <div class="quantity-input" style="display:inline-flex;">
                                        <button onclick="changeQty(${item.productId}, -1)">−</button>
                                        <input type="text" value="${item.quantity}" readonly
                                               id="qty-${item.productId}" style="width:40px;">
                                        <button onclick="changeQty(${item.productId}, 1)">+</button>
                                    </div>
                                </td>
                                <td style="font-weight:700;color:var(--danger);">¥${item.subtotal.toFixed(2)}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline"
                                            onclick="removeItem(${item.productId})"
                                            style="color:var(--danger);border-color:var(--danger);">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <div class="cart-summary">
                    <div>
                        <button class="btn btn-outline" onclick="cart.clear();renderCart();updateCartBadge();toast.info('购物车已清空');">
                            🗑️ 清空购物车
                        </button>
                    </div>
                    <div class="total-info">
                        <div class="total-label">共 ${items.reduce((s, i) => s + i.quantity, 0)} 件商品</div>
                        <div class="total-amount">合计：¥${totalAmount.toFixed(2)}</div>
                        <div style="font-size:0.8rem;color:var(--text-muted);">满199元包邮</div>
                    </div>
                    <button class="btn btn-danger btn-lg" onclick="goCheckout()">
                        💳 去结算
                    </button>
                </div>
            `;

            container.innerHTML = tableHTML;

            // 暴露函数到全局作用域
            window.changeQty = function(productId, delta) {
                const item = cart.getAll().find(i => i.productId === productId);
                if (!item) return;
                const newQty = item.quantity + delta;
                if (newQty < 1 || newQty > 99) return;
                cart.updateQuantity(productId, newQty);
                renderCart();
                updateCartBadge();
            };

            window.removeItem = function(productId) {
                const item = cart.getAll().find(i => i.productId === productId);
                const product = getProductById(productId);
                cart.remove(productId);
                toast.info(product ? `已移除「${product.name}」` : '已移除商品');
                renderCart();
                updateCartBadge();
            };

            window.goCheckout = function() {
                if (!isLoggedIn()) {
                    window.location.href = 'login.html?redirect=checkout';
                    return;
                }
                window.location.href = 'checkout.html';
            };
        }
    });
    </script>
</body>
</html>
