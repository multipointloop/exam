<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 — 長門番堂</title>
    <meta name="description" content="長門番堂用户登录与注册页面。学号：24215220132 姓名：黄政源">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="site-header">
        <div class="header-inner"></div>
    </header>

    <!-- 认证区域 -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="icon">🏮</div>
                <h2>長門番堂</h2>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <form class="auth-form active" id="loginForm" novalidate>
                <div class="form-group">
                    <label>用户名 <span class="required">*</span></label>
                    <input type="text" class="form-control" id="loginUsername" placeholder="请输入用户名" required>
                    <div class="form-error" id="loginUsernameError"></div>
                </div>
                <div class="form-group">
                    <label>密码 <span class="required">*</span></label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required>
                    <div class="form-error" id="loginPasswordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>
                <div class="auth-footer">
                    <p>还没有账号？<a href="#" id="switchToRegister">立即注册</a></p>
                    <p style="margin-top:8px;font-size:0.8rem;color:var(--text-muted);">
                        测试账号：demo / demo123
                    </p>
                </div>
            </form>

            <!-- 注册表单 -->
            <form class="auth-form" id="registerForm" novalidate>
                <div class="form-group">
                    <label>用户名 <span class="required">*</span></label>
                    <input type="text" class="form-control" id="regUsername" placeholder="4-16位字母或数字" required>
                    <div class="form-error" id="regUsernameError"></div>
                </div>
                <div class="form-group">
                    <label>邮箱 <span class="required">*</span></label>
                    <input type="email" class="form-control" id="regEmail" placeholder="请输入邮箱地址" required>
                    <div class="form-error" id="regEmailError"></div>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" class="form-control" id="regPhone" placeholder="请输入手机号（选填）">
                    <div class="form-error" id="regPhoneError"></div>
                </div>
                <div class="form-group">
                    <label>密码 <span class="required">*</span></label>
                    <input type="password" class="form-control" id="regPassword" placeholder="6-20位密码" required>
                    <div class="form-error" id="regPasswordError"></div>
                </div>
                <div class="form-group">
                    <label>确认密码 <span class="required">*</span></label>
                    <input type="password" class="form-control" id="regPassword2" placeholder="请再次输入密码" required>
                    <div class="form-error" id="regPassword2Error"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">注 册</button>
                <div class="auth-footer">
                    <p>已有账号？<a href="#" id="switchToLogin">立即登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-inner"></div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
    /**
     * 長門番堂 — 登录/注册页逻辑
     * 学号：24215220132  姓名：黄政源
     */
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();

        // 如果已登录则跳转
        if (isLoggedIn()) {
            const redirect = getUrlParam('redirect');
            if (redirect === 'checkout') {
                window.location.href = 'checkout.html';
            } else {
                window.location.href = '../index.html';
            }
            return;
        }

        // Tab切换
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');

        function switchTab(tabName) {
            tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
            forms.forEach(f => f.classList.toggle('active', f.id === tabName + 'Form'));
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        document.getElementById('switchToRegister')?.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('register');
        });

        document.getElementById('switchToLogin')?.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('login');
        });

        // 表单验证工具
        function showError(inputId, errorId, message) {
            const input = document.getElementById(inputId);
            const error = document.getElementById(errorId);
            if (input) input.classList.add('error');
            if (error) { error.textContent = message; error.classList.add('show'); }
        }

        function clearError(inputId, errorId) {
            const input = document.getElementById(inputId);
            const error = document.getElementById(errorId);
            if (input) input.classList.remove('error');
            if (error) { error.textContent = ''; error.classList.remove('show'); }
        }

        function clearAllErrors() {
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.form-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
        }

        // ========== 登录处理 ==========
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearAllErrors();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            let hasError = false;

            if (!username) {
                showError('loginUsername', 'loginUsernameError', '请输入用户名');
                hasError = true;
            }

            if (!password) {
                showError('loginPassword', 'loginPasswordError', '请输入密码');
                hasError = true;
            }

            if (hasError) return;

            // 模拟Ajax登录请求
            setTimeout(() => {
                const result = loginUser(username, password);
                if (result.success) {
                    toast.success('登录成功！欢迎回来，' + result.user.username);

                    const redirect = getUrlParam('redirect');
                    setTimeout(() => {
                        if (redirect === 'checkout') {
                            window.location.href = 'checkout.html';
                        } else {
                            window.location.href = '../index.html';
                        }
                    }, 800);
                } else {
                    toast.error(result.message);
                    showError('loginUsername', 'loginUsernameError', result.message);
                }
            }, 500);
        });

        // ========== 注册处理 ==========
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearAllErrors();

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;

            let hasError = false;

            // 用户名校验
            if (!username) {
                showError('regUsername', 'regUsernameError', '请输入用户名');
                hasError = true;
            } else if (!/^[a-zA-Z0-9一-龥]{4,16}$/.test(username)) {
                showError('regUsername', 'regUsernameError', '用户名需为4-16位字母、数字或中文');
                hasError = true;
            }

            // 邮箱校验
            if (!email) {
                showError('regEmail', 'regEmailError', '请输入邮箱地址');
                hasError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('regEmail', 'regEmailError', '邮箱格式不正确');
                hasError = true;
            }

            // 手机号校验（选填）
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                showError('regPhone', 'regPhoneError', '手机号格式不正确');
                hasError = true;
            }

            // 密码校验
            if (!password) {
                showError('regPassword', 'regPasswordError', '请输入密码');
                hasError = true;
            } else if (password.length < 6 || password.length > 20) {
                showError('regPassword', 'regPasswordError', '密码长度需为6-20位');
                hasError = true;
            }

            // 确认密码
            if (!password2) {
                showError('regPassword2', 'regPassword2Error', '请再次输入密码');
                hasError = true;
            } else if (password !== password2) {
                showError('regPassword2', 'regPassword2Error', '两次密码输入不一致');
                hasError = true;
            }

            if (hasError) return;

            // 模拟Ajax注册请求
            setTimeout(() => {
                const result = registerUser(username, password, email, phone || '');
                if (result.success) {
                    toast.success('注册成功！欢迎加入長門番堂 🎉');

                    const redirect = getUrlParam('redirect');
                    setTimeout(() => {
                        if (redirect === 'checkout') {
                            window.location.href = 'checkout.html';
                        } else {
                            window.location.href = '../index.html';
                        }
                    }, 800);
                } else {
                    toast.error(result.message);
                    if (result.message.includes('用户名')) {
                        showError('regUsername', 'regUsernameError', result.message);
                    } else if (result.message.includes('邮箱')) {
                        showError('regEmail', 'regEmailError', result.message);
                    }
                }
            }, 500);
        });

        // 实时清除错误
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', function() {
                const errorEl = this.parentElement.querySelector('.form-error');
                if (errorEl && errorEl.classList.contains('show')) {
                    this.classList.remove('error');
                    errorEl.textContent = '';
                    errorEl.classList.remove('show');
                }
            });
        });

        // 确保已存在demo测试账号
        const users = JSON.parse(localStorage.getItem('nagato_shop_users') || '[]');
        if (!users.find(u => u.username === 'demo')) {
            users.push({
                id: 9999,
                username: 'demo',
                password: 'demo123',
                email: 'demo@example.com',
                phone: '13800138000',
                avatar: '',
                balance: 0,
                points: 500,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('nagato_shop_users', JSON.stringify(users));
        }
    });
    </script>
</body>
</html>
