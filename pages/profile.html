<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 — 長門番堂</title>
    <meta name="description" content="長門番堂个人中心页面。学号：24215220132 姓名：黄政源">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="site-header">
        <div class="header-inner"></div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 面包屑 -->
        <div class="breadcrumb">
            <a href="../index.html">首页</a> <span>›</span>
            <span>个人中心</span>
        </div>

        <div id="profileContent">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-inner"></div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
    /**
     * 長門番堂 — 个人中心页逻辑
     * 学号：24215220132  姓名：黄政源
     */
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();

        if (!isLoggedIn()) {
            document.getElementById('profileContent').innerHTML = `
                <div class="cart-empty">
                    <div class="icon">🔒</div>
                    <h3>请先登录</h3>
                    <p>登录后即可查看个人中心</p>
                    <a href="login.html" class="btn btn-primary" style="margin-top:16px;">去登录</a>
                </div>`;
            return;
        }

        const user = getCurrentUser();
        const orders = getUserOrders();

        // 统计
        const stats = {
            totalOrders: orders.length,
            pendingOrders: orders.filter(o => o.status === 'pending').length,
            completedOrders: orders.filter(o => o.status === 'completed').length,
            totalSpent: orders.filter(o => o.status !== 'cancelled')
                .reduce((sum, o) => sum + o.total, 0)
        };

        let activeTab = 'overview';

        function renderProfile() {
            document.getElementById('profileContent').innerHTML = `
                <div class="profile-page">
                    <!-- 侧边栏 -->
                    <div class="profile-sidebar">
                        <div class="user-avatar">
                            <div class="avatar-icon">👤</div>
                        </div>
                        <div class="user-name">${user.username}</div>
                        <div class="user-email">${user.email || '未设置邮箱'}</div>
                        <nav class="profile-nav">
                            <a href="#" class="${activeTab === 'overview' ? 'active' : ''}" data-tab="overview">
                                📊 个人概览
                            </a>
                            <a href="#" class="${activeTab === 'edit' ? 'active' : ''}" data-tab="edit">
                                ✏️ 编辑资料
                            </a>
                            <a href="#" class="${activeTab === 'security' ? 'active' : ''}" data-tab="security">
                                🔒 安全设置
                            </a>
                            <a href="#" class="${activeTab === 'points' ? 'active' : ''}" data-tab="points">
                                💰 我的积分
                            </a>
                            <a href="orders.html">
                                📦 我的订单
                            </a>
                            <a href="cart.html">
                                🛒 购物车
                            </a>
                            <a href="#" id="sidebarLogout" style="color:var(--danger);">
                                🚪 退出登录
                            </a>
                        </nav>
                    </div>

                    <!-- 内容区 -->
                    <div class="profile-content" id="profileTabContent">
                        ${renderTabContent()}
                    </div>
                </div>
            `;

            // 绑定导航事件
            document.querySelectorAll('.profile-nav a[data-tab]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    activeTab = this.dataset.tab;
                    renderProfile();
                });
            });

            // 退出登录
            document.getElementById('sidebarLogout').addEventListener('click', function(e) {
                e.preventDefault();
                modal.show('退出登录', '<p>确定要退出当前账号吗？</p>', [
                    { text: '取消', action: 'close', cls: 'btn-outline' },
                    { text: '退出', action: 'confirm', cls: 'btn-danger', callback: () => {
                        logoutUser();
                        toast.info('已退出登录');
                        setTimeout(() => window.location.href = '../index.html', 500);
                    }}
                ]);
            });

            // 编辑资料表单事件
            if (activeTab === 'edit') {
                bindEditForm();
            }
            if (activeTab === 'security') {
                bindSecurityForm();
            }
        }

        function renderTabContent() {
            switch (activeTab) {
                case 'overview':
                    return `
                        <h3>📊 个人概览</h3>
                        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px;">
                            <div style="background:var(--info-bg);padding:20px;border-radius:var(--radius-md);text-align:center;">
                                <div style="font-size:2rem;font-weight:700;color:var(--info);">${stats.totalOrders}</div>
                                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px;">全部订单</div>
                            </div>
                            <div style="background:var(--warning-bg);padding:20px;border-radius:var(--radius-md);text-align:center;">
                                <div style="font-size:2rem;font-weight:700;color:var(--warning);">${stats.pendingOrders}</div>
                                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px;">待付款</div>
                            </div>
                            <div style="background:var(--success-bg);padding:20px;border-radius:var(--radius-md);text-align:center;">
                                <div style="font-size:2rem;font-weight:700;color:var(--success);">${stats.completedOrders}</div>
                                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px;">已完成</div>
                            </div>
                            <div style="background:var(--danger-bg);padding:20px;border-radius:var(--radius-md);text-align:center;">
                                <div style="font-size:1.5rem;font-weight:700;color:var(--danger);">¥${stats.totalSpent.toFixed(2)}</div>
                                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px;">累计消费</div>
                            </div>
                        </div>
                        <h4 style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:12px;">账户信息</h4>
                        <div class="detail-table-section">
                            <table class="info-table">
                                <tbody>
                                    <tr><td>用户名</td><td>${user.username}</td></tr>
                                    <tr><td>邮箱</td><td>${user.email || '未设置'}</td></tr>
                                    <tr><td>手机号</td><td>${user.phone || '未设置'}</td></tr>
                                    <tr><td>积分</td><td>${user.points || 0} 分</td></tr>
                                    <tr><td>注册时间</td><td>${user.createdAt ? new Date(user.createdAt).toLocaleString('zh-CN') : '未知'}</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                case 'edit':
                    return `
                        <h3>✏️ 编辑个人资料</h3>
                        <form id="editProfileForm" novalidate style="max-width:500px;">
                            <div class="form-group">
                                <label>用户名</label>
                                <input type="text" class="form-control" value="${user.username}" disabled>
                                <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">用户名暂不支持修改</div>
                            </div>
                            <div class="form-group">
                                <label>邮箱 <span class="required">*</span></label>
                                <input type="email" class="form-control" id="editEmail" value="${user.email || ''}" required>
                                <div class="form-error" id="editEmailError"></div>
                            </div>
                            <div class="form-group">
                                <label>手机号</label>
                                <input type="tel" class="form-control" id="editPhone" value="${user.phone || ''}">
                                <div class="form-error" id="editPhoneError"></div>
                            </div>
                            <button type="submit" class="btn btn-primary">💾 保存修改</button>
                        </form>
                    `;
                case 'security':
                    return `
                        <h3>🔒 安全设置</h3>
                        <form id="changePasswordForm" novalidate style="max-width:500px;">
                            <div class="form-group">
                                <label>当前密码 <span class="required">*</span></label>
                                <input type="password" class="form-control" id="currentPassword" required>
                                <div class="form-error" id="currentPasswordError"></div>
                            </div>
                            <div class="form-group">
                                <label>新密码 <span class="required">*</span></label>
                                <input type="password" class="form-control" id="newPassword" placeholder="6-20位新密码" required>
                                <div class="form-error" id="newPasswordError"></div>
                            </div>
                            <div class="form-group">
                                <label>确认新密码 <span class="required">*</span></label>
                                <input type="password" class="form-control" id="newPassword2" required>
                                <div class="form-error" id="newPassword2Error"></div>
                            </div>
                            <button type="submit" class="btn btn-primary">🔒 修改密码</button>
                        </form>
                    `;
                case 'points':
                    return `
                        <h3>💰 我的积分</h3>
                        <div style="background:var(--warning-bg);padding:30px;border-radius:var(--radius-md);text-align:center;margin-bottom:24px;">
                            <div style="font-size:0.9rem;color:var(--text-secondary);">当前积分</div>
                            <div style="font-size:3rem;font-weight:700;color:var(--warning);">${user.points || 0}</div>
                            <div style="font-size:0.85rem;color:var(--text-muted);">积分可抵扣现金（100积分=1元）</div>
                        </div>
                        <h4 style="margin-bottom:12px;">积分获取规则</h4>
                        <div class="detail-table-section">
                            <table class="info-table">
                                <tbody>
                                    <tr><td>注册奖励</td><td>+100 积分</td></tr>
                                    <tr><td>每消费1元</td><td>+1 积分</td></tr>
                                    <tr><td>完成订单评价</td><td>+10 积分</td></tr>
                                    <tr><td>每日签到</td><td>+5 积分</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <button class="btn btn-primary" style="margin-top:16px;" onclick="toast.success('签到成功！+5积分');">
                            📅 每日签到
                        </button>
                    `;
                default:
                    return '';
            }
        }

        function bindEditForm() {
            document.getElementById('editProfileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('editEmail').value.trim();
                const phone = document.getElementById('editPhone').value.trim();

                let hasError = false;
                if (!email) {
                    document.getElementById('editEmail').classList.add('error');
                    document.getElementById('editEmailError').textContent = '请输入邮箱';
                    document.getElementById('editEmailError').classList.add('show');
                    hasError = true;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('editEmail').classList.add('error');
                    document.getElementById('editEmailError').textContent = '邮箱格式不正确';
                    document.getElementById('editEmailError').classList.add('show');
                    hasError = true;
                }

                if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                    document.getElementById('editPhone').classList.add('error');
                    document.getElementById('editPhoneError').textContent = '手机号格式不正确';
                    document.getElementById('editPhoneError').classList.add('show');
                    hasError = true;
                }

                if (hasError) return;

                // 更新用户信息
                const users = JSON.parse(localStorage.getItem('nagato_shop_users') || '[]');
                const userIndex = users.findIndex(u => u.id === user.id);
                if (userIndex >= 0) {
                    users[userIndex].email = email;
                    users[userIndex].phone = phone;
                    localStorage.setItem('nagato_shop_users', JSON.stringify(users));

                    const updatedUser = { ...user, email, phone };
                    saveUser(updatedUser);
                    toast.success('个人资料已更新');
                    activeTab = 'overview';
                    renderProfile();
                }
            });
        }

        function bindSecurityForm() {
            document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const currentPwd = document.getElementById('currentPassword').value;
                const newPwd = document.getElementById('newPassword').value;
                const newPwd2 = document.getElementById('newPassword2').value;

                let hasError = false;

                // 验证当前密码
                const users = JSON.parse(localStorage.getItem('nagato_shop_users') || '[]');
                const currentUserData = users.find(u => u.id === user.id);
                if (!currentUserData || currentUserData.password !== currentPwd) {
                    document.getElementById('currentPassword').classList.add('error');
                    document.getElementById('currentPasswordError').textContent = '当前密码不正确';
                    document.getElementById('currentPasswordError').classList.add('show');
                    hasError = true;
                }

                if (!newPwd || newPwd.length < 6 || newPwd.length > 20) {
                    document.getElementById('newPassword').classList.add('error');
                    document.getElementById('newPasswordError').textContent = '新密码需为6-20位';
                    document.getElementById('newPasswordError').classList.add('show');
                    hasError = true;
                }

                if (newPwd !== newPwd2) {
                    document.getElementById('newPassword2').classList.add('error');
                    document.getElementById('newPassword2Error').textContent = '两次密码输入不一致';
                    document.getElementById('newPassword2Error').classList.add('show');
                    hasError = true;
                }

                if (hasError) return;

                // 更新密码
                if (currentUserData) {
                    currentUserData.password = newPwd;
                    localStorage.setItem('nagato_shop_users', JSON.stringify(users));
                    toast.success('密码修改成功');
                    activeTab = 'overview';
                    renderProfile();
                }
            });
        }

        renderProfile();
    });
    </script>
</body>
</html>
